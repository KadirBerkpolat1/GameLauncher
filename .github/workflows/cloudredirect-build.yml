name: Build CloudRedirect (32-bit)

on:
  workflow_dispatch:
  push:
    tags:
      - 'cloudredirect-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build 32-bit cloud_redirect.so
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    steps:
      - name: Checkout cloudredirect-moon
        uses: actions/checkout@v4
        with:
          repository: swwayps/cloudredirect-moon
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cloudredirect-moon

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            cmake gcc-12 g++-12 git \
            libstdc++-12-dev:i386 libc6-dev:i386 \
            pkg-config libssl-dev:i386 \
            docker.io

      - name: Build 32-bit cloud_redirect.so
        working-directory: cloudredirect-moon
        run: |
          # Use the project's build.sh which uses Docker for reproducible 32-bit build
          chmod +x build.sh
          ./build.sh

      - name: Verify binary
        working-directory: cloudredirect-moon
        run: |
          file cloud_redirect.so
          readelf -h cloud_redirect.so | grep Class
          # Ensure it's 32-bit ELF
          if ! file cloud_redirect.so | grep -q "ELF 32-bit"; then
            echo "ERROR: Not a 32-bit binary!"
            exit 1
          fi

      - name: Create release asset
        if: startsWith(github.ref, 'refs/tags/cloudredirect-v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#cloudredirect-v}
          cp cloudredirect-moon/cloud_redirect.so cloud_redirect-linux-${VERSION}.so
          echo "ASSET_NAME=cloud_redirect-linux-${VERSION}.so" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/cloudredirect-v')
        uses: softprops/action-gh-release@v1
        with:
          files: cloud_redirect-linux-${{ env.VERSION }}.so
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}